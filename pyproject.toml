[project]
name = "bi-bot"
version = "0.1.0"
description = "This is a test project for a Chat bot system for NielsenIQ BI Knowledge system"
readme = "README.md"
authors = [
    { email = "adityasamalprivatemail789@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deepeval>=4.3.1",
    "fastapi>=0.151.0",
    "flashrank>=0.2.10",
    "formulas>=1.3.4",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-google-vertexai>=3.2.4",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langfuse>=5.0.3",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "logfire[fastapi,requests]>=5.2.0",
    "loguru>=0.7.3",
    "nemoguardrails>=0.24.1",
    "nest-asyncio>=1.6.0",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "portkey-ai>=2.3.4",
    "pydantic>=2.0.0",
    "pypdf>=6.21.1",
    "python-calamine>=0.9.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "pytz>=2026.5",
    "pyxlsb>=1.0.10",
    "qdrant-client>=1.19.1",
    "ragas>=0.3.1",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "unstructured>=0.27.30",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
    "xlwings>=0.37.7",
]

[project.scripts]
bi-bot = "bi_bot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
